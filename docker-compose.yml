# ListenerLoop: app + Caddy (automatic HTTPS).
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#   docker compose exec app node dist/cli.js create-admin you@example.com
#
# Using a Cloudflare Tunnel or your own reverse proxy instead of Caddy?
# Start only the app: `docker compose up -d --build app`, publish the port by
# uncommenting `ports` below, and point the tunnel at http://localhost:3000.

services:
  app:
    build: .
    image: listenerloop:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - listenerloop-data:/data
    expose:
      - "3000"
    # ports:
    #   - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (for example listenerloop.app)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  listenerloop-data:
  caddy-data:
  caddy-config:
