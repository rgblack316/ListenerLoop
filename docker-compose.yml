# ListenerLoop: app + Caddy (automatic HTTPS).
#
# Easiest: sudo ./scripts/install.sh (installs Docker, asks questions, writes .env, starts everything).
#
# By hand:
#   cp .env.example .env      # edit it, and add the line COMPOSE_PROFILES=caddy
#   docker compose up -d --build
#   docker compose exec app node dist/cli.js create-admin you@example.com
#
# Cloudflare Tunnel or your own reverse proxy instead of Caddy? Leave COMPOSE_PROFILES unset and add
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tunnel.yml
# to .env, which publishes the app on 127.0.0.1:3000 for the tunnel to reach.

services:
  app:
    build: .
    image: listenerloop:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - listenerloop-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  listenerloop-data:
  caddy-data:
  caddy-config:
