<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Widget preview</title>
  <link rel="stylesheet" href="/static/widget.css">
  <link rel="stylesheet" href="/static/preview.css">
</head>
<body>
  <p class="cap">Embed on your site</p>
  <div class="site">
    <div id="pv-embed" class="pv-embed">
      <p id="pv-embed-title" class="pv-embed-title"></p>
      <p id="pv-embed-blurb" class="pv-embed-blurb"></p>
      <span id="pv-button" class="pv-button">Leave a voicemail</span>
      <p id="pv-embed-foot" class="pv-embed-foot">
        <svg viewBox="0 0 575 575" width="16" height="16" aria-hidden="true"><path d="M143 63C184 63 217 96 217 137L217 372L390 372C431 372 464 405 464 447C464 488 431 521 390 521L253 521C212 521 178 488 178 447L178 410L143 410C102 410 68 377 68 336L68 137C68 96 102 63 143 63ZM143 102C123 102 107 118 107 137L107 336C107 356 123 372 143 372L178 372L178 137C178 118 162 102 143 102ZM217 411L217 447C217 467 233 482 253 482L390 482C410 482 425 467 425 447C425 427 410 411 390 411Z" fill="#21649e" fill-rule="evenodd"/></svg>
        <span>Powered by <strong>ListenerLoop</strong></span>
      </p>
    </div>
  </div>

  <p class="cap">What opens</p>
  <main class="card pv-card" aria-hidden="true">
    <header class="head">
      <h1 id="pv-title">Leave a voicemail</h1>
      <span class="icon">&times;</span>
    </header>
    <p id="pv-prompt" class="prompt"></p>
    <section class="recorder">
      <div class="meter"><div class="meter-bar pv-meter"></div></div>
      <div class="timer"><span>0:00</span> / <span id="pv-limit">3:00</span></div>
      <div class="row"><span class="btn primary">Start recording</span></div>
      <p class="upload"><span class="linkbtn">Or upload an audio file</span></p>
    </section>
    <div class="field"><span>Your name <span class="req">(required)</span></span><div class="pv-input"></div></div>
    <div class="field" id="pv-email"><span>Email <span class="opt">(optional)</span></span><div class="pv-input"></div><small>Only share it if you would like a reply.</small></div>
    <div class="check" id="pv-consent"><input type="checkbox" tabindex="-1" disabled><span id="pv-consent-text"></span></div>
    <span class="btn primary wide pv-send">Send message</span>
  </main>

  <p class="cap">After sending</p>
  <div class="card pv-card" aria-hidden="true"><p id="pv-thanks" class="done"></p></div>
  <script src="/static/preview.js"></script>
</body>
</html>
